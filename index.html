<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Journey — A Story of Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
    }

    .login-box {
      width: 350px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #0066ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0052cc;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    // SHA-256 hash of the password.
    // Example password: "MyStrongPassword123!"
    const STORED_PASSWORD_HASH = "884ef38ad1ade33a317edb53a32a499384b08a84eaa2fa934625a5c7c871e4a3";

    const STORED_USERNAME = "cinta";

    async function sha256(text) {
      const data = new TextEncoder().encode(text);

      const hash = await crypto.subtle.digest("SHA-256", data);

      return [...new Uint8Array(hash)]
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        const passwordHash = await sha256(password);

        if (
          username === STORED_USERNAME &&
          passwordHash === STORED_PASSWORD_HASH
        ) {
          message.textContent = "Login successful!";
          message.style.color = "green";
          sessionStorage.setItem("loggedIn", "true");
          window.location.href = "main.html";
        } else {
          message.textContent = "Invalid username or password.";
          message.style.color = "red";
        }
      });
  </script>

</body>
</html>
